<section id="home" class="screen"><main class="home"><div class="langrow"><button id="langBtn" class="soft" onclick="toggleLang()">🌐 ไทย</button></div><div><div class="logo">UNO</div><div id="tagline" class="tagline">เกมไพ่หลากสี</div></div><div class="preview"><div class="card red"><span class="value">7</span><span class="spark">✦</span></div><div class="card blue"><span class="value">2</span><span class="spark">✦</span></div><div class="card green"><span class="value">5</span><span class="spark">✦</span></div><div class="card yellow"><span class="value long">UNO</span><span class="spark">✦</span></div></div><div id="playersLabel" class="subtitle">ผู้เล่น 1 คน + AI 3 คน</div><div class="diffbox"><div id="diffTitle" class="diff-title">เลือกระดับความยาก</div><div class="diffs"><button class="diff" data-level="easy" onclick="setDifficulty('easy')"><span>🌱</span><small id="easyTxt">ง่าย</small></button><button class="diff active" data-level="medium" onclick="setDifficulty('medium')"><span>⚔️</span><small id="mediumTxt">กลาง</small></button><button class="diff" data-level="hard" onclick="setDifficulty('hard')"><span>🔥</span><small id="hardTxt">ยาก</small></button></div><div id="description" class="description">AI เลือกใช้ไพ่พิเศษและดูสีในมือ</div></div><button class="start" id="startBtn" onclick="startGame()">▶ เริ่มเกม</button><button id="rulesBtn" class="rulesbtn" onclick="showRules()">ⓘ วิธีเล่น</button><div class="credit" id="credit">จัดทำโดย นางสาว ดวงกมล ศรีรัตน์ทวีกุล</div></main></section>
